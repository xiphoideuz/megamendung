# megamendung web relay worker.
# Deploy: npm install && npm run deploy
# (create the KV namespace first: `wrangler kv namespace create PAIRS` and
#  paste its id below, or delete the binding if you do not need it).

name = "megamendung-web"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = []

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "PAIRS"
id = "PAIRS_ID_PLACEHOLDER"
preview_id = "PAIRS_PREVIEW_ID_PLACEHOLDER"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDO"]